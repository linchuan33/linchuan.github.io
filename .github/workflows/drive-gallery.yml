name: Sync Drive photos and publish gallery
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'DRIVE_SYNC.md'
permissions:
  contents: read
concurrency:
  group: gallery-publish
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Verify sync logic
        run: python -m unittest discover -s tests -v
      - name: Import new photos and rebuild galleries
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/sync_drive.py
      - name: Save imported photos and append-only state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CuteAnimal CuteAnimal-preView Landscape Landscape-preView Portrait Portrait-preView data/drive-state.json gallery*.html
          if ! git diff --cached --quiet; then
            git commit -m 'Add new photos from Google Drive'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare optimized public files only
        run: python scripts/package_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
